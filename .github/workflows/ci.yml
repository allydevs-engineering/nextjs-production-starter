name: Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Automatically cancel older builds if a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-assurance:
    name: QA & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # Native Node 24+

      - name: Setup Node.js environment
        uses: actions/setup-node@v7 # Native Node 24+
        with:
          node-version: 'latest'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check
        continue-on-error: false

      - name: Run code linter
        run: npm run lint

      - name: Verify static types (TypeScript)
        run: npm run type:check

      - name: Execute unit & component tests
        run: npm run test:run

  production-build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    needs: quality-assurance # Only builds if formatting, linting, types, and tests pass
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Next.js build caching
      - name: Setup Next.js build cache
        uses: actions/cache@v5 # Node 24 compatible
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://localhost:3000
